services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tra
      POSTGRES_PASSWORD: tra_dev
      POSTGRES_DB: tra
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tra -d tra']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
